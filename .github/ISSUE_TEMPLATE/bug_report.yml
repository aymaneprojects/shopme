name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, database, etc. Do not paste secrets.
