name: Release

# Installers and the prebuilt server bundle are built for a published version: a `v*` tag, or a manual run given a
# version, builds them and attaches them to a GitHub Release, together with shopme-install.sh. A manual run without a
# version builds the same files and keeps them as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a GitHub Release, e.g. 0.1.1 (leave empty to only build the files)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # vX.Y.Z when this run publishes a release (a pushed tag, or a manual run given a version), empty otherwise.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version != '' && (startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version))) || '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, script: dist:win, pattern: 'apps/desktop/dist/*.exe' }
          - { name: macos, os: macos-latest, script: dist:mac, pattern: 'apps/desktop/dist/*.dmg' }
          - { name: linux, os: ubuntu-latest, script: dist:linux, pattern: 'apps/desktop/dist/*.AppImage' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # Windows Defender scanning freshly written files makes electron-builder copies fail with EBUSY.
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:LOCALAPPDATA\electron-builder", "$env:TEMP"

      - name: Set version from the release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: echo "VERSION_ARG=-c.extraMetadata.version=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Unsigned unless the signing secrets exist. Empty secrets must be unset: electron-builder rejects an empty CSC_LINK.
      - name: Build desktop app
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA="${VERSION_ARG:-}"
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          elif [ "${{ matrix.name }}" = "macos" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            EXTRA="$EXTRA -c.mac.notarize=true"
          fi
          # One retry: transient file locks on Windows runners.
          for attempt in 1 2; do
            rm -rf apps/desktop/dist
            pnpm --filter @shopme/desktop ${{ matrix.script }} $EXTRA && exit 0
            echo "desktop build failed (attempt $attempt)"; sleep 10
          done
          exit 1

      # Clear names so Mac users pick the right file: Apple Silicon (M1 and later) or Intel.
      - name: Rename Mac installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd apps/desktop/dist
          for f in *-mac-arm64.dmg; do [ -e "$f" ] && mv "$f" "${f%-mac-arm64.dmg}-mac-apple-silicon.dmg"; done
          for f in *-mac-x64.dmg; do [ -e "$f" ] && mv "$f" "${f%-mac-x64.dmg}-mac-intel.dmg"; done
          ls -la *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: shopme-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Prebuilt server bundle (shopme-server-<version>-<arch>.tar.gz + .sha256) for shopme-install.sh. Native dependencies are
  # platform specific, so each architecture is built on its own runner.
  bundle:
    name: Server bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@shopme/server --filter=@shopme/admin
      - name: Build the bundle
        shell: bash
        run: |
          if [ -n "$RELEASE_TAG" ]; then VERSION="${RELEASE_TAG#v}"; else VERSION="$(node -p "require('./package.json').version")"; fi
          node scripts/make-server-bundle.mjs --version "$VERSION" --arch "${{ matrix.arch }}" --out bundle-out
          ls -la bundle-out
      - uses: actions/upload-artifact@v4
        with:
          name: shopme-server-${{ matrix.arch }}
          path: bundle-out/*
          if-no-files-found: error

  # Publishes as soon as both server bundles are built. A desktop installer that could not be built (for example a macOS
  # job that GitHub never gave a runner) is left out instead of blocking the release.
  release:
    name: Publish GitHub Release
    needs: [build, bundle]
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version '${RELEASE_TAG#v}' (expected x.y.z)."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Add the installer script
        run: cp shopme-install.sh release-files/shopme-install.sh
      - name: List the files
        run: ls -la release-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
