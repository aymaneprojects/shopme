# nginx site for ShopMe. Replace shop.example.com, save as /etc/nginx/sites-available/shopme.conf, link it into
# sites-enabled, then: nginx -t && systemctl reload nginx && certbot --nginx -d shop.example.com
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    client_max_body_size 64m;

    location = /__shopme/tls-ask { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
