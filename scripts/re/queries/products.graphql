query($after:String){ products(first:10, after:$after){ pageInfo{hasNextPage endCursor}
 nodes{ id legacyResourceId handle title status vendor productType tags descriptionHtml createdAt updatedAt publishedAt templateSuffix
  seo{title description} options{id name position values optionValues{id name hasVariants}}
  priceRangeV2{minVariantPrice{amount currencyCode} maxVariantPrice{amount currencyCode}}
  featuredMedia{ ... on MediaImage { id image{url altText width height} } }
  media(first:10){nodes{ mediaContentType alt ... on MediaImage{ id image{url width height} } }}
  collections(first:10){nodes{id handle title}}
  metafields(first:10){nodes{namespace key type value}}
  variants(first:30){nodes{ id legacyResourceId title sku barcode price compareAtPrice position taxable inventoryPolicy inventoryQuantity availableForSale
    selectedOptions{name value} image{url}
    inventoryItem{ id tracked requiresShipping measurement{weight{unit value}} countryCodeOfOrigin harmonizedSystemCode
      inventoryLevels(first:3){nodes{ location{name} quantities(names:["available","on_hand","committed","incoming","reserved"]){name quantity} }} } }} } } }
